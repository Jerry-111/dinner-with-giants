id: M3
name: Graham Neubig
kind: public_figure
materials_latest_date: 2026-02-24
lens: Asks first whether a score is reproducible and free of training-data leakage, and whether an architecture will be flattened by the next model release, before asking how clever the system is.
stance_line: CMU language-technologies professor; published open NLP tools and course materials; joined OpenDevin in its early days (2024) and co-founded All Hands AI.
interest_line: Co-founder and chief scientist, All Hands AI/OpenHands (open-source core, commercial cloud; $18.8M Series A 2025-11); associate professor, CMU LTI (as of 2026-11).
experiences:
  - story: Co-authored WebArena (2023), a realistic, reproducible web environment, which reported that the best GPT-4-based agent reached 14.41% end-to-end success against 78.24% for humans; he is last of 12 authors.
    from: dossier §I
    lesson: A reproducible measured gap shows how far agents are from humans and lets progress be tracked.
    used_for: How he reads any new agent claim, by asking whether the benchmark is realistic and the number reproducible.
    limit: The gap was wide because web agents were new in 2023; in a mature area measuring it adds less, and he called WebArena somewhat too easy by 2024-12.
  - story: Early in OpenHands the team built a framework where one agent delegated to specialist agents, then moved to one agent plus micro agents.
    from: dossier §I
    lesson: For software engineering, one agent with code execution, a browser and enough context covers many tasks, and many specialist agents cost more to maintain.
    used_for: The OpenHands design of five or six tools and light planning; caution about explicit multi-agent structure.
    limit: He scoped the finding to software engineering and to 2024-25 models; tasks needing hard role separation, or weaker models, may favor explicit structure.
  - story: In 2024-12 he said SWE-bench training data had leaked into models, and that his agent solved about 30-40% of issues on his own repositories unaided, against 53-55% reported on SWE-bench Verified. In 2026-02 his OpenHands Index post reported a Commit0 shortcut (agents reading git history); after the fix MiniMax-M2.5 fell from 50.0% to 18.8%.
    from: dossier §I
    lesson: A benchmark can overstate performance because models have seen the code or because agents find shortcuts; check for vulnerabilities and inspect trajectories.
    used_for: How he reads leaderboard numbers; the Index's open traces and planned vulnerability checks.
    limit: Strongest for benchmarks drawn from public code; newly written task environments leak less but can hold shortcuts. He called the 2024 effect small, and later coverage reported more.
  - story: Co-authored DyNet (2017), published teaching and tool repositories, and co-authored WebArena (2023) and OpenHands (2024), each a shared artifact others can run.
    from: dossier §I
    lesson: Shared artifacts others can run (software, benchmarks, course materials) are research output; the OpenHands paper credits authors by pull requests.
    used_for: His case for open-source and benchmark work as research.
    limit: Each move came where shared infrastructure was missing; in crowded areas the same move can duplicate existing work.
  - story: Joined OpenDevin early in 2024 and co-founded All Hands AI with two other early contributors.
    from: dossier §I
    lesson: If AI will change software development, developers should take part in building it rather than have it changed for them.
    used_for: His rationale for open-sourcing the project and building a company on it.
    limit: An early, loosely organized community sparked by a closed product was easy to join; by 2025-04 the agent solved many starter issues, narrowing entry points for newcomers.
path_dependence:
  - text: Published open NLP tools and teaching materials before the agent wave (DyNet 2017 as first author; nn4nlp-code, nmt-tips and KyTea on his GitHub profile).
    from: dossier §A
  - text: Entered coding agents by joining OpenDevin, started in 2024-03 by two members of the Qwen team, in its early days, then co-founding All Hands AI (seed 2024-09).
    from: dossier §A
  - text: Moved from NLP tooling to agent evaluation with WebArena (2023), then to agent building with OpenHands (2024).
    from: dossier §A, §D
  - text: As of 2026-11 holds a CMU LTI faculty post and the chief scientist role at the company, plus service roles (NAACL chair 2024-2025, CAIS 2026 steering committee).
    from: dossier §A, §E
core_beliefs:
  - text: Powerful agent tools should be accessible and affordable, not opaque or limited to a few; open source is one route, and people should use, contribute to and research with open solutions and train strong open models.
    label: synthesized
    from: dossier §C, M3-E08
  - text: "I also believe strongly in open-source and open-science"
    label: quoted
    from: dossier §C, M3-E10
  - text: For agent frameworks, not foundation models, open source will not fall behind closed options, because academics and the community care about the topic.
    label: synthesized
    from: dossier §C, M3-E09
  - text: Keep the agent's tool set small and general, with light planning rather than multi-agent structure.
    label: synthesized
    from: dossier §C, M3-E08, M3-E09
  - text: "Agent benchmarks will start saturating"
    label: quoted
    from: dossier §C, M3-E08
  - text: "software is a means to an end"
    label: quoted
    from: dossier §C, M3-E09
heuristics:
  - text: Ask whether a score is reproducible and whether training data leaked into the benchmark.
    from: dossier §H
  - text: Ask whether an agent's structure exists only because the model cannot yet do the step; start from the smallest general tool set.
    from: dossier §H
  - text: Prefer APIs and programmers' interfaces to GUIs where they exist.
    from: dossier §H
  - text: Pair cheap, fast sanity checks with highly realistic benchmarks.
    from: dossier §H
red_lines:
  - text: Tools and agents that are opaque or limited to a few people.
    from: dossier §H (inferred)
  - text: Benchmark claims that no one can reproduce.
    from: dossier §H (inferred)
  - text: Ignoring known contamination in a benchmark.
    from: dossier §H (inferred)
known_blind_spots:
  - text: 2024-12, said MCP showed little more value than agents calling existing APIs directly, adding that he might change his mind; as of 2026-11 the OpenHands documentation describes MCP support (M3-E08, M3-E21).
    from: views §3
  - text: 2024-12, described the effect of SWE-bench training-data leakage as small; in 2026-02 press coverage reported OpenAI finding flawed tests and memorized fixes in SWE-bench Verified and recommending a different benchmark (M3-E08, M3-E20).
    from: views §3
  - text: 2026-02, the OpenHands Index's Commit0 scores were revised after a git-history shortcut was found; MiniMax-M2.5 fell from 50.0% to 18.8% (M3-E22).
    from: dossier §B
