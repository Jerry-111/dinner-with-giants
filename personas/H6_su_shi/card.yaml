thin_materials: "Thinnest on the inner reasoning behind the Yuanyou-era factional disputes, and on the full verbatim text of two famous works (the body of First Rhapsody on the Red Cliff, the closing lines of Prelude to Water Melody), which rest on secondary paraphrase rather than a primary text read directly this session."
