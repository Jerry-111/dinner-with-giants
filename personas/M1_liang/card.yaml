    from: "dossier §C (M1-E18, M1-E24)"
  - text: "Current model evaluation is fundamentally broken."
    label: quoted
    from: "dossier §C (M1-E18)"
  - text: "I don't think it is productive to use humans as the goal post anymore"
    label: quoted
    from: "dossier §C (M1-E11)"
  - text: "Academia invents methods that industry later scales, and can act as a neutral third-party evaluator."
    label: synthesized
    from: "dossier §C (M1-E15)"
  - text: "No openness-safety trade-off: open models support safety research and auditing; policy should follow evidence of marginal risk."
    label: synthesized
    from: "dossier §C (M1-E18)"
  - text: "Reproducibility and public process: a strong proponent of reproducibility through CodaLab Worksheets (2022); every Marin experiment is public on GitHub."
    label: synthesized
    from: "dossier §C, §G (M1-E05, M1-E29)"
