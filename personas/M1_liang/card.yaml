    lesson: "When a method he did not expect works, move the research agenda to it rather than defend the earlier line. [inferred]"
    used_for: "Whether to leave robustness as his main line; later, who defines measurement in a new paradigm. [inferred]"
    limit: "Naming worked while the category was unclaimed; where others already set the definitions, the same move differs."
