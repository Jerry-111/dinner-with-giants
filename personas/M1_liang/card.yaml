    from: "dossier §I (also §A; M1-E12, M1-E13)"
    lesson: "A runnable artifact brings hosting cost and misuse exposure that a paper does not. [inferred]"
    used_for: "Later release choices: Cybench's written release rationale and Marin's public process (the link is inferred)."
    limit: "A 7B model behind a moderation API is a different risk from a 535B model; the same mitigations may not carry over."
