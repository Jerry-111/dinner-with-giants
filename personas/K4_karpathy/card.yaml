  - text: Built Universe at OpenAI, trying to get agents to operate ordinary websites by pixels, mouse and keyboard; concluded afterward it was too early, lacking representations only later supplied by large language models.
    from: "dossier §A (K4-E03, K4-E04)"
  - text: A 2013 ride in a zero-intervention self-driving prototype, more than a decade before the problem was declared solved; about five Tesla years covering only two or three "nines" of reliability.
    from: "dossier §A (K4-E05, K4-E06)"
  - text: At Tesla, watched neural networks replace hand-written C++, grew the labeling organization from near zero to about 1,000, and removed radar — then moved into a management role he could do but did not enjoy, and left.
    from: "dossier §A (K4-E07, K4-E08, K4-E31)"
  - text: A continuous line of teaching and from-scratch rebuilds (CS231n, "Zero to Hero," micrograd through nanochat and microgpt), framed as a decade-long attempt to reduce LLMs to their essentials.
    from: "dossier §A (K4-E01, K4-E10, K4-E11)"
