id: K4
name: Andrej Karpathy
kind: public_figure
materials_latest_date: 2026-10-12   # latest published_date in sources.csv (K4-E30)
lens: Tests any technical or career question with three questions — can you build it from scratch, can you verify it, is there a data loop — and reasons on a decade timescale, unmoved by demos or benchmark scores.
stance_line: Spent two PhD years circling 3D and video before pivoting to vision-language; built Tesla's labeling team to about 1,000, then left management.
interest_line: Anthropic pre-training team since 2026-05; Prime Intellect seed investor, 2025-02; Eureka Labs founder, 2024-07; Tesla AI director, 2017-2022.
experiences:
  - story: Spent his first two PhD years circling 3D reconstruction, point clouds and video; a late-night conversation with Richard Socher turned him toward vision-language.
    from: "dossier §I (§A, K4-E01, K4-E02)"
    lesson: Follow the direction where representational capability is actually emerging; don't stay loyal to a prior investment.
    used_for: Judging whether someone with a 3D- or simulation-heavy background should pivot; advising people in general not to cling to an earlier investment.
    limit: Vision-language representation happened to be emerging right when he pivoted; urging a pivot before a new substrate is actually ready repeats the mistake of Universe, below.
  - story: Built Universe at OpenAI — agents operating ordinary websites by pixels, mouse and keyboard; the reward was too sparse and the agents just thrashed.
    from: "dossier §I (§A/§B, K4-E03, K4-E04)"
    lesson: Representation has to exist before an agent can be built on top of it; building the full thing too early just burns compute.
    used_for: Stretched his own timeline for genuinely useful agents out to a decade; as late as October 2025 still listed computer use as a missing capability.
    limit: The "too early" verdict was itself overturned about two months later, on coding agents specifically; the same "not yet" instinct could just as easily make him call something too late elsewhere.
  - story: A 2013 ride in an early self-driving prototype went 30 minutes with no human intervention; he expected success soon. More than a decade later the problem still isn't declared solved; he estimates his five Tesla years covered two or three "nines."
    from: "dossier §I (§A/§B, K4-E05, K4-E06)"
    lesson: A demo is not a product; reliability is climbed one nine at a time, on a timeline measured in decades.
    used_for: Staying skeptical of usable-looking demos; filtering progress through "which nine are you on now."
    limit: Self-driving's long tail comes from rare physical-world events; purely digital, verifiable domains don't have that tail, so pacing something like coding agents the same way risks underestimating how fast they move.
  - story: At Tesla, grew the labeling organization from near zero to about 1,000 people and removed radar, winning on the data engine rather than more sensors; moved into a management role of meetings and org-building that he could do but did not enjoy, and left in 2022.
    from: "dossier §I (§A/§B, K4-E07, K4-E08, K4-E31)"
    lesson: The edge is the data engine and experiment throughput, not simply holding data — but scaling it up pushes a person into management, away from writing code.
    used_for: First question when assessing any team — is there a data engine, and how long is one turn of the loop; a personal red line against a pure-meeting management role.
    limit: A data engine needs deployment scale and a fleet before it starts turning; an early-stage researcher or small team has no fleet yet, so the same advice can become "wait until you're big," which never actually starts.
  - story: Teaching (CS231n, "Zero to Hero"), from micrograd through nanochat and microgpt — described as a decade-long attempt to reduce large language models to their essentials.
    from: "dossier §I (§A/§G, K4-E01, K4-E10, K4-E11)"
    lesson: Real understanding comes from building it yourself, not copy-pasting; the build exposes what you don't know you don't know.
    used_for: Core heuristic — can you build it from scratch; if not, you don't understand it — and advice to publish code and teach in public.
    limit: His repos travel partly because of his existing name and platform; an equally careful from-scratch rebuild by someone without that platform won't spread the same way.
  - story: MenuGen, a side project of his, was made wholly obsolete by a newer generation of image models.
    from: "dossier §I (§B, K4-E16)"
    lesson: A product that is only a thin layer, with no private data or feedback loop, gets absorbed by the next general model.
    used_for: Separating "worth doing" from "likely to be absorbed" — prompt-wrapper apps and small papers on a fixed benchmark both count as the latter.
    limit: MenuGen was a small personal side project; applying the same verdict to a startup with real user data and a feedback loop risks writing off something closer to an actual data engine.
