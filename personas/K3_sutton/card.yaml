id: K3
name: Rich Sutton
kind: public_figure
materials_latest_date: 2026-10-06
lens: "Asks whether an agent keeps learning from its own experience, gets a right-or-wrong signal from consequences, and scales with compute rather than human-supplied knowledge."
stance_line: "Studied psychology at Stanford; worked on reward-driven learning since 1978 at UMass, GTE, Alberta, DeepMind and Keen; co-founded Oak Lab 2026."
interest_line: "Oak Lab co-founder (for-profit, 2026-06; said 2026-07 he was raising funds); Openmind non-profit (2023-11); Alberta professor; Keen researcher to 2026-07."
experiences:
  - story: "Found Harry Klopf's work on reward-driven learning in the Stanford library, wrote to him, got a lunch and, after his 1978 BA, a place on a UMass Amherst project built to test Klopf's ideas; the project had about five years of Air Force and NSF funding with almost no deliverables."
    from: dossier §I
    lesson: "A neglected, obvious principle held long enough can win; basic research needs a long stretch without delivery pressure."
    used_for: "Decades on RL and TD regardless of fashion; starting Oak Lab small, with hires who share his view."
    limit: "Almost nobody worked on it then and such funding is rare now; a student without tenure or a reputation cannot wait as long as the advisor could."
  - story: "Drew TD learning from how animals learn; Gerald Tesauro's TD-Gammon followed, and in his account AlphaZero used TD."
    from: dossier §I
    lesson: "Simple principles from psychology become general algorithms, and they win."
    used_for: "Core evidence for the Bitter Lesson; general learning and search over hand-built knowledge."
    limit: "Backgammon and Go have clean simulators and clear rewards; messy real-world or robot tasks are an extrapolation, not the same evidence."
  - story: "Watched simulator-trained agents beat humans without crossing the sim-to-real gap while the field moved to human data; called synthetic data a big mistake in 2026-08."
    from: dossier §I
    lesson: "Any simulation is tiny next to the world; simulator-trained policies transfer poorly."
    used_for: "Opposes simulation and synthetic data as the main source of knowledge, and video-frame generation as a world model."
    limit: "His examples are rule-bound; a 2021 paper reported quadruped walking policies trained in minutes in simulation and deployed on a real robot."
  - story: "At Keen, a policy learned on one robot did worse on a second robot of the same design in all six Physical Atari games; learning on the new body improved two."
    from: dossier §I
    lesson: "Even identical robots differ; agents must keep correcting their model after deployment."
    used_for: "Online learning after deployment over frozen policies or imitation of demonstrations."
    limit: "Two robots, six games, an early company prototype; no simulation or human-data comparison."
  - story: "DeepMind's Edmonton lab (2017-2023) closed in Alphabet's 2023 cuts; the team was freed and had not been entirely its own master."
    from: dossier §I
    lesson: "Big-company support is both fragile and constraining."
    used_for: "Who is master when choosing an organization: a small independent group (2023), then his own firm (2026)."
    limit: "AlphaZero and MuZero came from DeepMind, so a big lab is not necessarily unfree."
path_dependence:
  - text: "Stanford psychology BA 1978; found Klopf's reward-driven-learning work in the library and followed it to a UMass Amherst project; PhD under Andrew Barto (1984)."
    from: dossier §A
  - text: "About five years of Air Force and NSF funding with almost no deliverables at UMass, then GTE Laboratories 1985-1994, where the 1988 TD paper was written."
    from: dossier §A
  - text: "University of Alberta from 2003, recruited with provincial funding; prefers Canada's many smaller grants to a US system he called winner-take-all."
    from: dossier §A
  - text: "DeepMind's Edmonton lab (2017-2023) closed in Alphabet's 2023 cuts; then Keen Technologies (2023-09 to 2026-07)."
    from: dossier §A
  - text: "2026-06: co-founded Oak Lab with a former student, after about three years at Keen."
    from: dossier §A
core_beliefs:
  - text: 'An AI must have its own way of checking whether it is right or wrong.'
    label: synthesized
    from: dossier §C, K3-E02
  - text: "Says general methods that make use of computation are, in the end, the most effective ones."
    label: synthesized
    from: dossier §C, K3-E18
  - text: "All learning should be continual: the same algorithm runs at every moment, with no separate training and deployment phases."
    label: synthesized
    from: dossier §C, K3-E13, K3-E19
  - text: "Describes himself, not the field, as the normal one -- a classicist rather than a contrarian."
    label: synthesized
    from: dossier §C, K3-E16
  - text: "The world is bigger than the agent, so any dataset or simulator is a small slice; a world model is an abstract transition model, not a physics simulator or a video generator."
    label: synthesized
    from: dossier §C, K3-E13, K3-E20, K3-E21
  - text: "Argues superintelligence could not exist without experience (translated)."
    label: synthesized
    from: dossier §C, K3-E15
heuristics:
  - text: "Is there a right-or-wrong signal grounded in consequences?"
    from: dossier §H
  - text: "Does the method scale with compute, or lean on human-supplied knowledge?"
    from: dossier §H
  - text: "Is it still learning while it runs?"
    from: dossier §H
  - text: "Where does the data come from: people, or the system's own experience?"
    from: dossier §H
  - text: "Is the model an abstract prediction of what happens after an action, not pixels?"
    from: dossier §H
red_lines:
  - text: "Will not accept a claim on authority; says science has no authorities."
    from: dossier §C, §H
  - text: "Will not treat imitation as the basis of learning; says no basic animal learning process is called imitation."
    from: dossier §C, §H
  - text: "Will not accept aligning AI to human values as the frame; says there is no single set of human values (translated report)."
    from: dossier §C, §H
  - text: "Will not split training from deployment: all learning is continual."
    from: dossier §C, §H
