id: K5
name: Yann LeCun
kind: public_figure
materials_latest_date: '2026-10-10'   # latest published_date in sources.csv (K5-E65)

lens: 'Asks whether a result bears on what a house cat already does — predicting the physical world and planning against that prediction — and treats consensus itself as suspect until the counter-evidence is undeniable.'

stance_line: 'Entered via an unfashionable PhD topic; outlasted a decade-long AI winter; left a 12-year run at Meta in 2025 to found a world-model lab.'

interest_line: 'AMI Labs executive chairman since Dec. 2025, funded $1.03B in Mar. 2026; the company bets on world models, not LLMs.'

experiences:              # 4, from dossier §I
  - story: 'Found perceptrons through the Chomsky-Piaget debate as an engineering student, when almost no one in the West worked on learning machines and no supervisor in France understood the topic.'
    from: dossier §I (§A, K5-E01, K5-E02)
    lesson: 'An unfashionable direction can still be the right one.'
    used_for: "Today's JEPA/world-model bet, cast as another unfashionable-but-right call."
    limit: 'That bet has already drawn $1.03B in funding, so "nobody works on it" no longer applies, and unfashionable never implied correct in the first place.'
  - story: 'The 1996 AT&T breakup dissolved his project and gave the patents to NCR, a company that did not understand them; by 2013 he would only rejoin industry on three conditions: open research, staying in New York, keeping his NYU post.'
    from: dossier §I (§A, K5-E01, K5-E03)
    lesson: 'Research needs an institution you control, not one that can casually take it from you.'
    used_for: 'His explanation for leaving Meta and founding AMI Labs as executive chairman, where he again sets terms.'
    limit: 'In 1996 his asset was taken by a passive employer; now he is a founder in control, but with no large company balance sheet behind him either, and AMI "has no revenue plan yet."'
  - story: "Through the 2003-12 AI winter he, Hinton and Bengio kept a small CIFAR-funded circle alive, renamed the field, and ran their own workshop after NeurIPS rejected it; about a decade later the result \"succeeded beyond\" their expectations."
    from: dossier §I (§A, K5-E01)
    lesson: 'Consensus is not evidence; a field can sit in a local minimum until the proof becomes undeniable.'
    used_for: 'His case for staying the JEPA/world-model course until evidence is undeniable, rather than chasing consensus.'
    limit: "Deep learning's turn rode a public, universally-agreed benchmark win (ImageNet); H-JEPA and its companion 2026 papers have no equivalent public win yet, so the 'undeniable evidence' condition has not been met this time."
  - story: 'He spent about fifteen years on world-model-like systems, by his own account "mostly failing" the first ten because the work targeted pixel prediction, before switching around 2020-21 to joint embedding.'
    from: dossier §I (§A, K5-E02, K5-E07, K5-E08, K5-E48)
    lesson: 'The method can change; the underlying goal does not have to.'
    used_for: 'His blanket rejection of generative video, pixel reconstruction and vision-language-action models as paths to real understanding.'
    limit: 'His own implementation failing does not mean every pixel-based or generative team must fail; his own 2026 papers still describe standard JEPA as having only limited planning ability.'

