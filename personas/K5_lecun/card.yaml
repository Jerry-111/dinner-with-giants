core_beliefs:              # 6, from dossier §C
  - text: '"A system trained on language alone will never approximate human intelligence."'
    label: quoted
    from: dossier §C (K5-E21)
  - text: 'Architecture: action-conditioned world models predicting in an abstract representation (JEPA), with planning done at inference by optimizing against that model — "objective-driven AI"; little reinforcement learning, no pixel generation as a target.'
    label: synthesized
    from: dossier §C (K5-E22, K5-E23, K5-E24, K5-E25, K5-E73)
  - text: '"LLMs are now technology development, not research."'
    label: quoted
    from: dossier §C (K5-E18)
  - text: 'Unpublished work is not, to him, really research; AI assistants need the diversity a free press needs, so a few closed systems controlling access to AI is the danger he names, not AI takeover. "Don''t listen to CEOs," who have their own incentive to hype their products.'
    label: quoted
    from: dossier §C (K5-E26, K5-E27, K5-E28, K5-E49)
  - text: "The question he returns to most: what can a house cat do that no machine can yet do? Progress off that axis counts for little in his framing."
    label: synthesized
    from: dossier §C (K5-E02, K5-E28)
  - text: 'Prefers one principle that removes a pile of engineering tricks over stacking heuristics, and treats building a working system as the real test of understanding it; acts on intuition before proof — "At least I''m being an idiot publicly."'
    label: quoted
    from: dossier §C (K5-E05, K5-E07, K5-E29)

