known_blind_spots:          # 3, from views §3 / dossier §D
  - text: 'When he names a specific thing today''s LLMs cannot do, he repeatedly draws that line too tightly, and the gap has consistently moved against the limit, not confirmed it: his dismissal of GPT-3, his claim that text alone cannot teach physical common sense, and "autoregressive LLMs can''t really reason, can''t plan" were each later undercut to varying degrees (IMO gold, 97.8% on Blocksworld).'
    from: views §3
  - text: 'His active timelines (a new paradigm within 3-5 years; "completely obvious" by early 2027) ask for resolution several times faster than his one fully-vindicated long-run bet, neural networks, which took about a decade to pay off.'
    from: views §3-4
  - text: 'His standard response to a counterexample is that the model was "specially trained" on that exact case, rather than updating; he keeps rejecting vision-language-action models and generative video in blanket terms even as counter-evidence (π0.5, Veo-based evaluators) accumulates.'
    from: dossier §D, §G

