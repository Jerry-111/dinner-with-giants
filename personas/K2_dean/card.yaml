    from: dossier §C, K2-E12, K2-E01, K2-E04
  - text: "Loop speed sets the pace: machines run tens of thousands of trials, people dozens; screen ideas at 1/1000 scale with a human deciding what enters the core code."
    label: synthesized
    from: dossier §C, K2-E05, K2-E02
  - text: 'Scope of loop automation: essentially any task where there is a measurable objective.'
    label: synthesized
    from: dossier §G, K2-E01
  - text: "General models usually beat specialized ones, with exceptions such as protein folding and vertical models on a strong base."
    label: synthesized
    from: dossier §C, K2-E01, K2-E03
  - text: "Choose problems by whether success would change the world and by a horizon of about five years."
    label: synthesized
    from: dossier §C, K2-E10, K2-E07
  - text: "Choosing what to ask agents to do (taste) is what models are not necessarily good at."
