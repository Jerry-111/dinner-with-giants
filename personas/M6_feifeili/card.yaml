id: M6
name: Fei-Fei Li
kind: public_figure
materials_latest_date: 2026-09-28   # latest published_date in sources.csv (M6-E04/M6-E05/M6-E06)
lens: Asks, for any research question, whether it defines a new resource/benchmark/environment or
  just scores someone else's already-defined pipeline; attributes paradigm shifts to getting the
  resource/benchmark/environment right rather than to one clever algorithm.
stance_line: Immigrated to the US at 15 into poverty; led ImageNet's build (2007-2012) after years
  of Caltech research she calls publishable but not a breakthrough.
