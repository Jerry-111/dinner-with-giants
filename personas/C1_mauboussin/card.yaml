id: C1
name: Michael Mauboussin
kind: public_figure
materials_latest_date: 2026-09-22   # latest published_date in sources.csv
lens: "Not a technology specialist: asks first what the base rate is for a claim like this, who captures the value once competition arrives, and what the price already assumes."
stance_line: "Packaged-food analyst from 1992; Wall Street investment strategist; Columbia Business School adjunct since 1993; author on base rates, skill versus luck and expectations investing."
interest_line: "Head of Consilient Research, Counterpoint Global, Morgan Stanley Investment Management (as of 2026-11); book The Investing Mind on pre-order, due 2026-11-24."
experiences:
  - story: "After Drexel Burnham Lambert's training program he worked as a stockbroker and, by his account, was bad at it and was effectively fired."
    from: "dossier §I (also §A, §B; C1-E05, C1-E06)"
    lesson: "Skill matching: find what you are likely to be okay at and where you could be more useful."
    used_for: "His own move to analysis and research; his advice to people who fail early."
    limit: "Switching roles inside finance is cheap; a researcher changing subfield has higher sunk costs."
  - story: "A training-program colleague handed him Rappaport's Creating Shareholder Value; its case led him to a Drexel packaged-food analyst and a career as one."
    from: "dossier §I (also §A; C1-E05)"
    lesson: "Small events and role models almost set a trajectory."
    used_for: "The start of his method: cash flow over accounting earnings, expectations in prices."
    limit: "One path is one observation; it is silent on others who read the same book and went elsewhere."
  - story: "2007 family bet: offered to pay $20 if the Red Sox swept the World Series and receive $5 if not, put the sweep at 12-18%; they swept and he paid."
    from: "dossier §I (also §B; C1-E07)"
    lesson: "One outcome does not judge a decision; repeated at those odds the other side loses."
    used_for: "His rule to judge by process; how he defends a probability estimate after a miss."
    limit: "Many small repeated bets average out; a one-off, high-stakes choice does not, and one result cannot test the 12-18% estimate."
  - story: "Close to Bill Miller, whose Value Trust beat the S&P 500 for 15 straight years (1991-2005) and lost two thirds of its value by end-2008; Miller cited his streak research in 2007."
    from: "dossier §I (also §A, §B; C1-E05, C1-E11, C1-E12)"
    lesson: "Long streaks mix skill and luck: they show neither that skill is absent nor that it will persist."
    used_for: "Whether a long run of success should be extrapolated."
    limit: "No public reflection by him on 2008 was found; the lesson comes from his streak research, not his account of this case."
  - story: "2026: judged the OpenAI and Oracle Cloud five-year revenue projections low-probability against 75 years of listed-company data; 2025 growth came in well ahead of expectations; the May follow-up said base rates are dynamic."
    from: "dossier §I (also §B, §D; C1-E10, C1-E13, C1-E14)"
    lesson: "Anchor on the reference class, then update; base rates move."
    used_for: "How to read a growth forecast: unprecedented is neither the base case nor impossible."
    limit: "The reference class is listed companies; leading AI labs are private, so it may lag."
