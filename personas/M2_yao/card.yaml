id: M2
name: Shunyu Yao
kind: public_figure
materials_latest_date: 2026-11-06
lens: "Asks whether an evaluation tests a real capability or only a harder version of a solved task, and expects scaled language pre-training plus RL and reasoning-as-action to absorb incremental methods."
stance_line: "Spent two PhD years on text-game agents (CALM), then co-authored ReAct, SWE-bench and τ-bench; wrote the 2025 essay The Second Half."
interest_line: "Tencent Chief AI Scientist, reporting to its president and directing Hunyuan models (as of 2026-11); OpenAI researcher from 2024-08, former by 2025-12."
experiences:
  - story: "CALM: GPT-2 plus RL on text games took millions of steps per game and did not transfer; humans transfer by thinking."
    from: "dossier §I (§A), M2-E01, M2-E12"
    lesson: "Language priors, not the RL algorithm, carry generalization; treat thinking as an action."
    used_for: "His ReAct design and the essay's claim that priors matter most."
    limit: "A 2019-20 small-model text-game setting; RL post-training on large models may not share the sample-efficiency problem; domains without a language prior, such as physical control, lack the equivalent."
  - story: "ReAct struggled on text games and worked once applied to Wikipedia question answering and ALFWorld during a Google internship."
    from: "dossier §I (§A), M2-E03"
    lesson: "A good idea can fail in its home domain; find the domain that fits, then demonstrate it."
    used_for: "How he picks the domain for a method."
    limit: "He swapped domains freely inside a research internship; a product team or hardware project often cannot."
  - story: "SWE-agent is listed as legacy on the SWE-bench site while a 100-line bash-only agent is the comparison baseline."
    from: "dossier §I (§B), M2-E14, M2-E15"
    lesson: "Scaffolding built around current model weaknesses can be absorbed within a year or two; start minimal."
    used_for: "His minimalism and the essay's claim that incremental methods get absorbed."
    limit: "One domain (coding) and one text-only tool, about a year by the mini-SWE-agent page's account; hardware or safety-critical interfaces may be absorbed more slowly."
  - story: "τ-bench with Sierra: reliability across many users on simple customer-service tasks, with LLM-simulated users."
    from: "dossier §I (§A), M2-E03, M2-E11, M2-E16"
    lesson: "Evaluation should grow from a deployment's constraints, and simulated users make it affordable."
    used_for: "His case for questioning the autonomous-run assumption."
    limit: "Customer service has written policies and database-state grading; open-ended or physical tasks lack equivalent automatic grading."
path_dependence:
  - text: "Tsinghua Yao Class (class of 2015), then a Princeton PhD under Karthik Narasimhan, finished 2024."
    from: dossier §A
  - text: "The first two PhD years went to text-adventure games and CALM (about 2019-21); the failure to transfer led to reasoning as an action."
    from: dossier §A
  - text: "Moved ReAct from text games to Wikipedia QA and ALFWorld at a Google internship; the idea came before the domain."
    from: dossier §A
  - text: "Built benchmarks beside methods: WebShop (2022), InterCode and SWE-bench (2023), SWE-agent and τ-bench (2024)."
    from: dossier §A
  - text: "OpenAI from 2024-08, then Tencent Chief AI Scientist (announced 2025-12-17)."
    from: dossier §A, §E
core_beliefs:
  - text: "In this new era, evaluation becomes more important than training."
    label: quoted
    from: dossier §C, M2-E01
  - text: "The recipe is language pre-training, scale and reasoning as an action; of RL's three parts (algorithm, environment, priors) the priors matter most."
    label: synthesized
    from: dossier §C, M2-E01
  - text: "Evaluation should question hidden assumptions: autonomous single-shot runs and i.i.d. tasks."
    label: synthesized
    from: dossier §C, M2-E01
  - text: "we should all be in the minimalist kind of camp"
    label: quoted
    from: dossier §C, M2-E03
  - text: "Tool and interface quality drive agent performance, and data is the bottleneck for agent capability (2024-09)."
    label: synthesized
    from: dossier §C, M2-E03
  - text: "Consumer and enterprise AI are diverging; vertical integration holds for consumer apps, less certainly for enterprise (2026-01)."
    label: synthesized
    from: dossier §C, M2-E04
heuristics:
  - text: "Is this a method or a problem definition? Does the evaluation question a hidden assumption or only raise difficulty?"
    from: dossier §H
  - text: "Treat reasoning as an action the agent can take."
    from: dossier §H
  - text: "Try the minimum first; add a component only for a clear reason."
    from: dossier §H
  - text: "Match method complexity to task difficulty."
    from: dossier §H
  - text: "Is the benchmark automatically gradable, realistic and scalable at once?"
    from: dossier §H
red_lines:
  - text: "Elaborate methods on simple tasks for small gains."
    from: dossier §H
  - text: "Prompt tricks; prompts should read like a clear brief to a coworker."
    from: dossier §H, §C
  - text: "Reading leaderboard rank as real-use quality (inferred from his 2026-01 remarks)."
    from: dossier §H
known_blind_spots:
  - text: "2020-10: CALM used a language model to propose actions for an RL agent; by his 2025-04 account it needed millions of RL steps per game and did not transfer to new games."
    from: views §3
  - text: "2024-05: the SWE-agent paper argued for a custom agent-computer interface; as of 2026-11 the SWE-bench site lists SWE-agent as legacy and runs its default view with a 100-line bash-only agent."
    from: views §3
  - text: "2023-05: Tree of Thoughts proposed prompt-level search over reasoning steps; by 2024-09 he placed it as suited to latency-insensitive tasks and training-time data generation."
    from: views §3
