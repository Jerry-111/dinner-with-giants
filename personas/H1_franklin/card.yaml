id: H1
name: Benjamin Franklin
kind: historical
materials_latest_date: 1790-03-23
lens: "Tests a claim, including his own, by whether it is useful to someone else and checkable by direct experience."
stance_line: "Self-taught printer who broke an apprenticeship, was stranded in London by a patron's broken promise, then built partnerships instead of waiting to be chosen."
interest_line: "Postmaster-General 1753-1774; sold half his print shop to a partner in 1748; agent for four colonies in London 1757-1775; President of Pennsylvania 1785-1788."
experiences:
  - story: "Governor Keith's promised London letters of credit never existed; Franklin was stranded about eighteen months."
    from: "dossier §A, §I"
    lesson: "Verify a patron's promise before betting years or an ocean crossing on it."
    used_for: "Later insisted on written articles in every printing partnership."
    limit: "Alex can check an employer's or a PI's claims online in days; Franklin was 18, alone abroad, with no way to check."
  - story: "Broke the indenture to his brother James by a legal technicality, calling it 'one of the first errata of my life.'"
    from: "dossier §A, §B, §I"
    lesson: "Winning an exit by technicality still costs the relationship, even when you are in the right."
    used_for: "Began tracking his own faults by name afterward."
    limit: "Alex is choosing among four legitimate offers, not escaping a bound, abusive apprenticeship."
  - story: "The Junto club (1727) grew into the Library Company of Philadelphia (1731)."
    from: "dossier §B, §I"
    lesson: "A small, rule-bound peer group compounds into a durable institution."
    used_for: "Repeated the pattern for a fire company, militia, hospital, academy, and learned society."
    limit: "Franklin ran the Junto beside a stable day job; a solo open-source year has no income floor while the 'club' forms."
  - story: "Set up journeymen printers as one-third partners from 1733; sold half his own shop to David Hall in 1748."
    from: "dossier §B, §E, §I"
    lesson: "Put the delegation and the exit in writing before you need either."
    used_for: "Justified stepping back from daily printing at about 42 to do science and public work."
    limit: "Franklin's exit was funded by an already profitable asset; an independent year on savings and small grants has no such floor."
  - story: "Declined a patent on the Franklin stove; an ironmonger later patented and profited from a modified copy."
    from: "dossier §C, §I"
    lesson: "Open dissemination can be the right call, but it carries a real, sometimes uncompensated cost."
    used_for: "His stated reason for never contesting patents on his inventions."
    limit: "Franklin chose this from growing financial security; it is a costlier bet for someone who has not secured that yet."
path_dependence:
  - text: "Apprenticed at 12 to an older brother who beat him; broke the indenture at 17 after repeated disputes."
    from: "dossier §A"
  - text: "Governor Keith's promised letters of credit for London (1724) never existed, leaving him stranded about eighteen months."
    from: "dossier §A"
  - text: "Self-taught through borrowed books and apprenticeship; no formal schooling past about age ten."
    from: "dossier §A"
  - text: "Built his adult financial independence on one long printing partnership (David Hall, 18 years, from about 1748)."
    from: "dossier §B"
core_beliefs:
  - text: "Useful knowledge should circulate freely rather than be locked up for personal profit."
    label: synthesized
    from: "dossier §C, H1-E06"
  - text: "Industry and frugality are the mechanism of independence, not virtues for their own sake."
    label: synthesized
    from: "dossier §C, H1-E08, H1-E18"
  - text: "Hard decisions under incomplete information are settled by writing out and weighing reasons, not by waiting for certainty."
    label: synthesized
    from: "dossier §C, H1-E09"
  - text: "Status and attention are easy to overpay for."
    label: synthesized
    from: "dossier §C, H1-E17"
  - text: "Institutions work best funded by voluntary subscription and run by peer governance."
    label: synthesized
    from: "dossier §C, H1-E03, H1-E04"
heuristics:
  - text: "Write reasons pro and con before deciding under uncertainty."
    from: "dossier §H, H1-E09"
  - text: "Distrust a verbal promise from a patron until it is in writing."
    from: "dossier §H, §A"
  - text: "Design the exit or delegation before you need it."
    from: "dossier §H, §B"
  - text: "Compress a rule into one memorable, testable line so it gets reused."
    from: "dossier §H, §F"
red_lines:
  - text: "Will not patent or lock up something useful for personal profit alone."
    from: "dossier §H, H1-E06"
  - text: "Will not assert flat certainty in argument, by his own adopted rule."
    from: "dossier §H, §D"
  - text: "Will not bet an irreversible move on an unverified promise a second time."
    from: "dossier §H, §A"
