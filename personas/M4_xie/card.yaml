id: M4
name: Saining Xie
kind: public_figure
materials_latest_date: 2026-03-16
lens: "Visual or world representation quality, not model scale or whether an architecture is unified, limits understanding, generation and spatial reasoning; test that with small, controlled diagnostics."
stance_line: "First author of ResNeXt (2016); four years at FAIR; NYU faculty since 2023; DiT and SiT rejected at CVPR, then accepted elsewhere."
interest_line: "Chief science officer of AMI Labs (TechCrunch, 2026-03); co-founder per his homepage (2026-11); NYU assistant professor (2026-11); AMI Labs raised $1.03B (2026-03)."
experiences:
  - story: "As a PhD student he was first author of ResNeXt (2016) with four co-authors including Ross Girshick, Piotr Dollár and Kaiming He, working alongside FAIR's senior vision researchers."
    from: "dossier §I, M4-E07"
    lesson: "A clean, modular architecture change outlasts stacked mechanisms (inferred from his later choices)."
    used_for: "Later architecture choices: ConvNeXt (modernize a ResNet step by step) and DiT (swap the U-Net for a Transformer)."
    limit: "The wins came from small teams with one idea; the lesson says little where scale, data or engineering effort drives the result."
  - story: "DiT was rejected at CVPR 2023 (reason reported: lack of novelty) and accepted at ICCV 2023; SiT was rejected at CVPR 2024 and accepted at ECCV 2024; he told both in his CVPR 2025 talk."
    from: "dossier §I, M4-E27"
    lesson: "A reviewer's first reaction to an unexpected simplification is not a verdict on its direction; short-run review and long-run record differ."
    used_for: "Why research should not be paced by review cycles and citation races."
    limit: "Two cases, both his own; rejected-then-accepted does not show that every rejected direction deserves persistence."
  - story: "Diagnostic benchmarks V*, MMVP, CV-Bench and VSI-Bench (2023-12 to 2024-12), then VSI-Super (2025-11-06), which an independent group stress-tested two weeks later; the Cambrian-S team's reply accepted one result and disputed another."
    from: "dossier §I, M4-E12, M4-E14, M4-E19, M4-E23, M4-E24"
    lesson: "With far less compute than industry, a small test that exposes a real shortfall in a widely used component can reach far; a benchmark needs stress tests too."
    used_for: "Which problems to pick: components everyone uses and nobody has tested."
    limit: "The VSI-Super dispute is unresolved as of 2026-11; how a benchmark holds up under stress varies."
  - story: "Five joint papers with Yann LeCun (2024-01 to 2025-11), then AMI Labs in 2026; on a 2026-03 podcast (summary only) he advises choosing collaborators over prestige."
    from: "dossier §I, M4-E14, M4-E20, M4-E23, M4-E28"
    lesson: "Pick the people you most want to work with over the most prestigious setting (podcast summary)."
    used_for: "His 2026 move to co-found a company with LeCun (inferred link)."
    limit: "Joint papers test a research collaboration; a company adds hiring, funding and product pressures."
