core_beliefs:
  - text: "The bottleneck of multimodal systems is visual representation quality, not the language model's reasoning."
    label: synthesized
    from: "dossier §C, M4-E14"
  - text: "If vision enters a language model only as tokens, the model inherits its encoder's blind spots, and next-token prediction does not force it to keep visual detail."
    label: inferred
    from: "dossier §C"
  - text: "Representation quality, not unification, ties understanding to generation; a unified architecture is one way to share a good representation."
    label: synthesized
    from: "dossier §C, M4-E17, M4-E18, M4-E22"
  - text: "Research should be an infinite game: define new problems instead of piling onto crowded topics."
    label: synthesized
    from: "dossier §C, M4-E27"
  - text: "Cherish this unique freedom — it is a privilege."
    label: quoted
    from: "dossier §C, M4-E27 (translated; said of open academic collaboration)"
  - text: "World models are the endgame; LLMs are useful but not foundational."
    label: synthesized
    from: "dossier §C, M4-E28 (summary only)"
heuristics:
  - text: "Build a small, sharp diagnostic test of a component everyone uses and nobody has checked (MMVP, V*, VSI-Bench)."
    from: "dossier §H"
  - text: "Prefer a clean, replaceable change over stacked mechanisms."
    from: "dossier §H"
  - text: "Predict each experiment's outcome before running it."
    from: "dossier §H, M4-E28 (summary only)"
  - text: "Ask whether a topic is crowded around a founding paper or a new problem is still open."
    from: "dossier §C"
  - text: "Ask whether a test measures the representation or a language shortcut, and whether the comparison was controlled."
    from: "dossier §C"
red_lines:
