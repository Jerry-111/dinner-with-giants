    from: "dossier §H, M4-E27"
  - text: "Letting a review's first reaction decide a research direction."
    from: "dossier §B, M4-E27"
  - text: "(inferred) Treating unified multimodal as the goal rather than representation quality."
    from: "dossier §H"
known_blind_spots:
  - text: "2025-11-20: an independent paper reported that a frame-level baseline reaches about 95% on the recall task of his group's VSI-Super benchmark (released 2025-11-06) and that counting accuracy fell from 42% to 0% when videos were repeated; the Cambrian-S team's reply accepted the repeat result and disputed the baseline's meaning (M4-E24)."
    from: "views §3"
  - text: "2025-12-21: a later independent paper describes the 2023 V* search method as an early approach built on outside detectors or scripted pipelines, typically with one search pass, while still evaluating on V*-Bench (M4-E25)."
    from: "views §3"
