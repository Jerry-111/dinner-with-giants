heuristics:               # 3-5: what the persona asks first when judging something
  - text: "Remove or replace the assumed-necessary component and re-measure on one clean metric."
    from: dossier §H
  - text: "Predict the outcome before running the experiment; keep pre-hoc and post-hoc apart."
    from: dossier §H (M5-E13)
  - text: "Ask whether the result holds on what has not been seen and whether it scales with compute."
    from: dossier §H
  - text: "Look for the last hand-crafted stage in a pipeline and ask whether it can be learned end to end."
    from: dossier §H (M5-E14)
